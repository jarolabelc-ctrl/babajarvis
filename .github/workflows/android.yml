
name: Compilar JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Verificar archivos
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name gradlew -type f

      - name: Compilar APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f jarvis-gemini/gradlew ]; then
            cd jarvis-gemini
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: No se encontro gradlew"
            exit 1
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
